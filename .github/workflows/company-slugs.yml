name: Migrate company URL slugs
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview or apply reviewed company slug fields
        required: true
        default: preview
        type: choice
        options: [preview, apply]
permissions:
  contents: read
jobs:
  company-slugs:
    if: github.ref == 'refs/heads/main' && (inputs.mode == 'preview' || inputs.mode == 'apply')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      SLUG_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Save original slug fields and migration preview
        run: node_modules/.bin/tsx scripts/migrate-company-slugs.ts --preview
      - uses: actions/upload-artifact@v4
        with:
          name: company-slug-preview
          path: .company-slugs/*.json
          include-hidden-files: true
          retention-days: 30
      - name: Apply reviewed slug fields in resumable batches
        if: inputs.mode == 'apply'
        run: node_modules/.bin/tsx scripts/migrate-company-slugs.ts --apply
