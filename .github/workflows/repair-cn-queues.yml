name: Repair discovery queue subscribers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 35
    concurrency:
      group: deploy-background-jobs-production
      cancel-in-progress: false
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: us-central1
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build reviewed worker image
        run: |
          image="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/ifindata/sec-fundamentals:$GIT_SHA"
          bash scripts/build-fundamentals.sh "$image"
          digest="$(gcloud artifacts docker images describe "$image" --project "$GCP_PROJECT_ID" --format='value(image_summary.fully_qualified_digest)')"
          [[ "$digest" == *@sha256:* ]]
          echo "WORKER_IMAGE=$digest" >> "$GITHUB_ENV"
      - name: Deploy and verify candidates without traffic
        run: |
          set -euo pipefail
          for spec in cn-fundamentals-subscriber:10 cn-company-discovery-subscriber:10 sec-company-discovery-subscriber:10; do
            service="${spec%:*}"
            concurrency="${spec#*:}"
            suffix="q${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            revision="$service-$suffix"
            gcloud run services update "$service" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
              --image "$WORKER_IMAGE" --update-env-vars "GIT_SHA=$GIT_SHA" --concurrency "$concurrency" \
              --revision-suffix "$suffix" --no-traffic --tag queue-repair --async --quiet
            ready=false
            for attempt in {1..84}; do
              revision_details="$(gcloud run revisions describe "$revision" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json 2>/dev/null || true)"
              if [[ -n "$revision_details" ]] && jq -e --arg image "$WORKER_IMAGE" --arg sha "$GIT_SHA" --argjson concurrency "$concurrency" \
                '(.status.conditions | any(.type == "Ready" and .status == "True")) and .spec.containers[0].image == $image and .spec.containerConcurrency == $concurrency and (.spec.containers[0].env | any(.name == "GIT_SHA" and .value == $sha))' <<<"$revision_details" >/dev/null; then
                ready=true; break
              fi
              sleep 5
            done
            [[ "$ready" == true ]] || { echo "Candidate $revision did not become ready" >&2; exit 1; }
            candidate_url=''
            for attempt in {1..24}; do
              details="$(gcloud run services describe "$service" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
              candidate_url="$(jq -r --arg revision "$revision" '.status.traffic[] | select(.tag == "queue-repair" and .revisionName == $revision and (.percent // 0) == 0) | .url' <<<"$details")"
              [[ "$candidate_url" == https://* ]] && break
              sleep 5
            done
            service_url="$(jq -er '.status.url' <<<"$details")"
            [[ "$candidate_url" == https://* ]]
            token="$(gcloud auth print-identity-token --audiences="$service_url")"
            echo "::add-mask::$token"
            [[ "$(curl --fail --silent --show-error -H "Authorization: Bearer $token" "$candidate_url/health")" == ok ]]
            echo "$service $revision" >> "$RUNNER_TEMP/cn-queue-candidates"
          done
      - name: Promote verified candidates
        run: |
          set -euo pipefail
          while read -r service revision; do
            gcloud run services update-traffic "$service" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --to-revisions "$revision=100" --quiet
          done < "$RUNNER_TEMP/cn-queue-candidates"
      - name: Update paced discovery producers for future scheduled executions
        run: |
          set -euo pipefail
          for job in collect-intelligence-news-production collect-earnings-production collect-sec-filings-production; do
            gcloud run jobs update "$job" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
              --image "$WORKER_IMAGE" --update-env-vars "GIT_SHA=$GIT_SHA" --quiet
          done
