name: Deploy directory sync job
on:
  workflow_dispatch:
concurrency:
  group: deploy-directory-sync-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: us-central1
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build directory sync image
        run: |
          image="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/ifindata/directory-sync:$GITHUB_SHA"
          gcloud builds submit . --project "$GCP_PROJECT_ID" --config cloudbuild.directory-sync.yaml --substitutions "_IMAGE=$image"
          echo "DIRECTORY_SYNC_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Deploy job image without executing maintenance
        run: |
          gcloud run jobs update sync-cni-directory-production --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --image "$DIRECTORY_SYNC_IMAGE" --quiet
