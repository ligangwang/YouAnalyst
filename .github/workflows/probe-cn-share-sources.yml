name: Probe A-share share-count sources
on:
  workflow_dispatch:
    inputs:
      codes:
        description: Comma-separated A-share IDs or codes (blank for the default sample)
        required: false
        default: ""
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe public exchange endpoints (read-only, no credentials)
        env:
          CODES: ${{ inputs.codes }}
        run: npx --yes tsx@4 scripts/probe-cn-share-sources.ts "$CODES"
