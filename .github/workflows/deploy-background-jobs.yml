name: Deploy background jobs
on:
  workflow_dispatch:
    inputs:
      job:
        description: Worker code to deploy (does not run a task)
        type: choice
        required: true
        default: all
        options: [all, cn-fundamentals, sec-fundamentals, private-valuations, directory]
permissions:
  contents: read
concurrency:
  group: deploy-background-jobs-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: us-central1
      WEB_RUNTIME_SERVICE_ACCOUNT: ${{ vars.WEB_RUNTIME_SERVICE_ACCOUNT }}
      CLOUD_RUN_SERVICE_PRODUCTION: ${{ vars.CLOUD_RUN_SERVICE_PRODUCTION }}
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      GIT_SHA: ${{ github.sha }}
      TARGET_JOB: ${{ inputs.job }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and deploy selected workers
        run: bash scripts/deploy-background-jobs.sh "$TARGET_JOB"
