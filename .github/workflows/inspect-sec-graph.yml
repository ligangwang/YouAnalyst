name: Inspect SEC and graph rollout

on:
  workflow_dispatch:
    inputs:
      compare_theme_evidence:
        description: Run the bounded IBM and A-share theme comparison
        required: false
        default: false
        type: boolean
      usage_report:
        description: Read stored token counters and graph budget ledger only
        required: false
        default: false
        type: boolean
      company:
        description: Explicit US ticker to inspect (no SEC calls or writes)
        required: true
        default: NVDA
        type: string

      saved_nvda_request:
        description: Optional exact failed NVDA request ID for one read-only OpenAI response GET
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  usage-report:
    if: github.ref == 'refs/heads/main' && inputs.usage_report && !inputs.compare_theme_evidence
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Read stored usage aggregates without provider calls or writes
        run: node scripts/inspect-background-usage.mjs
  inspect-only:
    if: github.ref == 'refs/heads/main' && !inputs.usage_report && !inputs.compare_theme_evidence
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      CLOUD_RUN_SERVICE_PRODUCTION: ${{ vars.CLOUD_RUN_SERVICE_PRODUCTION }}
      GIT_SHA: ${{ github.sha }}
      COMPANY: ${{ inputs.company }}
      SEC_FILINGS_COLLECTOR_ENABLED: '0'
      COMPANY_GRAPH_PAID_ADMISSION_ENABLED: ${{ vars.COMPANY_GRAPH_PAID_ADMISSION_ENABLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify the non-secret web graph topic
        run: bash scripts/inspect-graph-topic.sh
      - name: Read issuer cursor and queue ledger counts
        # Existing identity only. Missing Firestore read permission fails closed;
        # this step never creates grants, impersonates another identity, runs
        # a Cloud Run job, reads provider secrets or applies collector work.
        run: node_modules/.bin/tsx scripts/collect-sec-filings.ts --dry-run --baseline-only "--company=$COMPANY"
      - name: Read recent graph execution diagnostics
        # Existing identity, exact graph job, newest five executions; allow-listed
        # status/args only. No environment values, raw errors, or log reads.
        run: node scripts/inspect-graph-executions.mjs
      - name: Read only the already-created NVDA provider response metadata
        if: ${{ inputs.company == 'NVDA' && inputs.saved_nvda_request != '' }}
        env:
          EXPECTED_GRAPH_REQUEST_ID: ${{ inputs.saved_nvda_request }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node_modules/.bin/tsx scripts/inspect-saved-graph-response.ts
  compare-theme-evidence:
    if: github.ref == 'refs/heads/codex/evidence-first-theme-classification' && inputs.compare_theme_evidence
    runs-on: ubuntu-latest
    environment: theme-classification-test
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
    steps:
      # The comparison code is pinned: changing the branch cannot change what
      # receives the protected test environment credentials after approval.
      - uses: actions/checkout@v4
        with:
          ref: 53446cccfef39daba7161a1804c64e7c390557f1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Compare two existing issuers without enrollment writes
        run: npx tsx scripts/compare-theme-evidence.ts
