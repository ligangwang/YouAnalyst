name: Publish reviewed company identities
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Preview or publish verified identities to existing companies
        type: choice
        options: [preview, write]
        default: preview
        required: true
permissions:
  contents: read
concurrency:
  group: company-identity-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx --test tests/company-identities.test.ts
      - run: npx tsx scripts/publish-company-identities.ts --validate
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Check and publish company identities
        run: |
          case "$OPERATION" in preview|write) ;; *) exit 1 ;; esac
          npx tsx scripts/publish-company-identities.ts "--$OPERATION"
